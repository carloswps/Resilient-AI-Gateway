services:
  resilient-ai-gateway:
    image: resilient-ai-gateway
    build:
      context: .
      dockerfile: Resilient-AI-Gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MongoDb__ConnectionString=mongodb://mongo:27017/resilient_gateway
      - MongoDb__DatabaseName=resilient_gateway
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "dotnet", "--info" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - gateway-net
    restart: unless-stopped
  
  nginx:
    image: nginx:1.27-alpine
    container_name: gateway_nginx
    ports:
      - "80:80"
    volumes:
      - ./Resilient-AI-Gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Resilient-AI-Gateway/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      resilient-ai-gateway:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: gateway_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resilient_gateway
    volumes:
      - mongo_data:/data/db
      - ./Resilient-AI-Gateway/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:
    driver: bridge

volumes:
  mongo_data: